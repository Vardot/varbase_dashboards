name: Varbase Dashboards - Default
description: A recipe to manage default installed modules, configs and permissions.
type: install
install:
  - content_moderation
  - layout_builder_restrictions
  - dashboards
  - dashboards_views
config:
  import:
    dashboards: '*'
    dashboards_views: '*'
    varbase_dashboards:
      - views.view.varbase_dashboards_content_in_draft
      - views.view.varbase_dashboards_content
      - views.view.varbase_dashboards_recent_changes
      - views.view.varbase_dashboards_recently_created.
      - views.view.varbase_dashboards_terms
      - views.view.varbase_dashboards_users
      - dashboards.dashboard.dashboard
  actions:
    user.role.authenticated:
      grantPermissions:
        - 'access varbase dashboards content in drafts by user'
        - 'access varbase dashboards recent changes by user'
        - 'access varbase dashboards recently created by user'
    user.role.editor:
      grantPermissions:
        - 'can view dashboard dashboard'
        - 'access varbase dashboards content'
        - 'access varbase dashboards content in draft'
        - 'access varbase dashboards content in drafts by user'
        - 'access varbase dashboards recent changes'
        - 'access varbase dashboards recent changes by user'
        - 'access varbase dashboards recently created'
        - 'access varbase dashboards recently created by user'
    user.role.seo_admin:
      grantPermissions:
        - 'can view dashboard dashboard'
        - 'access varbase dashboards content'
        - 'access varbase dashboards content in draft'
        - 'access varbase dashboards content in drafts by user'
        - 'access varbase dashboards recent changes'
        - 'access varbase dashboards recent changes by user'
        - 'access varbase dashboards recently created'
        - 'access varbase dashboards recently created by user'
        - 'access varbase dashboards terms'
    user.role.content_admin:
      grantPermissions:
        - 'can view dashboard dashboard'
        - 'access varbase dashboards content'
        - 'access varbase dashboards content in draft'
        - 'access varbase dashboards content in drafts by user'
        - 'access varbase dashboards recent changes'
        - 'access varbase dashboards recent changes by user'
        - 'access varbase dashboards recently created'
        - 'access varbase dashboards recently created by user'
        - 'access varbase dashboards terms'
        - 'access varbase dashboards comments'
    user.role.site_admin:
      grantPermissions:
        - 'can view dashboard dashboard'
        - 'access varbase dashboards content'
        - 'access varbase dashboards content in draft'
        - 'access varbase dashboards content in drafts by user'
        - 'access varbase dashboards recent changes'
        - 'access varbase dashboards recent changes by user'
        - 'access varbase dashboards recently created'
        - 'access varbase dashboards recently created by user'
        - 'access varbase dashboards terms'
        - 'access varbase dashboards comments'
        - 'access varbase dashboards users'
        - 'can override dashboard dashboard'
